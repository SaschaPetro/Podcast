name: Morgenlauf

# Takt 2 der Pipeline (zeitkritischer Morgenlauf) - siehe README Abschnitt
# 2/7. Setzt voraus, dass Takt 1 (sammellauf.py / sammellauf.yml) bereits
# gelaufen ist und offene Themen hinterlassen hat.
#
# Automatischer Trigger ist NICHT mehr eine feste Uhrzeit (frueher per
# "schedule", siehe Git-Historie), sondern haengt sich per "workflow_run"
# direkt an das ENDE von Sammellauf - startet also immer erst, wenn Takt 1
# tatsaechlich fertig ist, egal wie lange der gedauert hat oder wann er
# ausgeloest wurde (siehe sammellauf.yml, das wiederum per Vercel Cron
# angestossen wird statt per unzuverlaessigem GitHub-"schedule" - README
# Abschnitt 10). Der job-Filter unten sorgt dafuer, dass Morgenlauf bei
# einem fehlgeschlagenen Sammellauf NICHT anspringt (kein Sinn, ohne neue
# offene Themen zu starten), aber bei manuellem Anstossen (workflow_dispatch)
# immer laeuft, unabhaengig vom letzten Sammellauf-Ergebnis.
#
# Zusaetzlich weiterhin manuell ausloesbar (Button "Run workflow" im
# Actions-Tab).
"on":
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Sammellauf"]
    types: [completed]

jobs:
  morgenlauf:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: morgenlauf.py ausfuehren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FAST_MODEL: ${{ vars.GEMINI_FAST_MODEL }}
          GEMINI_QUALITY_MODEL: ${{ vars.GEMINI_QUALITY_MODEL }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -o pipefail
          python morgenlauf.py | tee lauf.log

      - name: Fehlschlag in Job-Zusammenfassung markieren
        if: failure()
        run: |
          {
            echo "> [!CAUTION]"
            echo "> **Morgenlauf fehlgeschlagen**"
            echo ">"
            echo "> Lauf [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) ist mit einem Fehler abgebrochen. Volles Log im Artefakt \`morgenlauf-${{ github.run_id }}\` (lauf.log)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f lauf.log ]; then
            {
              echo ""
              echo "**Letzte Zeilen von lauf.log:**"
              echo '```'
              tail -n 30 lauf.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lauf-Log und Audio als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morgenlauf-${{ github.run_id }}
          path: |
            lauf.log
            output/**
          if-no-files-found: ignore
          retention-days: 14
