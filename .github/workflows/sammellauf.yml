name: Sammellauf

# Takt 1 der Pipeline (Sammeln & Aufbereiten) - siehe README Abschnitt 2/7.
# Laeuft automatisch werktags per Zeitplan (siehe "schedule" unten), eine
# Stunde vor dem Morgenlauf (Takt 2, siehe morgenlauf.yml), damit dieser
# garantiert offene Themen vorfindet. Zusaetzlich weiterhin manuell
# ausloesbar (Button "Run workflow" im Actions-Tab).
"on":
  workflow_dispatch: {}

  # Zeitplan: Start 06:45 Uhr lokaler Zeit (Sommerzeit/MESZ, UTC+2) =
  # 04:45 UTC, jeden Wochentag ("1-5" = Montag-Freitag) - eine Stunde vor
  # dem Morgenlauf (07:45 lokal / 05:45 UTC, siehe morgenlauf.yml), und
  # damit auch mit dem hier gesetzten 30-Minuten-Timeout komfortabel vor
  # dessen Start abgeschlossen.
  #
  # ACHTUNG: Dieser Wert ist in UTC. Bei Wechsel auf Winterzeit (MEZ, ab
  # Ende Oktober) muss der Wert um 1 Stunde nach vorne verschoben werden
  # (04:45 -> 05:45 UTC), sonst verschiebt sich der reale Lauf-Zeitpunkt
  # um eine Stunde - genau wie beim Morgenlauf (siehe dort und README
  # Abschnitt 10). Beide Zeitplaene muessen beim Zeitwechsel gemeinsam
  # angepasst werden, damit der Ein-Stunden-Abstand erhalten bleibt.
  schedule:
    - cron: "45 4 * * 1-5"

jobs:
  sammellauf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: sammellauf.py ausfuehren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FAST_MODEL: ${{ vars.GEMINI_FAST_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          set -o pipefail
          python sammellauf.py | tee lauf.log

      - name: Fehlschlag in Job-Zusammenfassung markieren
        if: failure()
        run: |
          {
            echo "> [!CAUTION]"
            echo "> **Sammellauf fehlgeschlagen**"
            echo ">"
            echo "> Lauf [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) ist mit einem Fehler abgebrochen. Volles Log im Artefakt \`sammellauf-${{ github.run_id }}\` (lauf.log)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f lauf.log ]; then
            {
              echo ""
              echo "**Letzte Zeilen von lauf.log:**"
              echo '```'
              tail -n 30 lauf.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lauf-Log als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sammellauf-${{ github.run_id }}
          path: lauf.log
          if-no-files-found: ignore
          retention-days: 14
